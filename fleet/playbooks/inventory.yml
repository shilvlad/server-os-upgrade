---
- name: Подготовить локальный каталог отчёта
  ansible.builtin.import_playbook: prepare.yml

- name: Инвентаризировать серверы
  hosts: all:!localhost
  gather_facts: false
  become: true
  tasks:
    - name: Собрать инвентаризацию
      ansible.builtin.import_role:
        name: fleet
        tasks_from: inventory
