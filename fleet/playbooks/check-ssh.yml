---
- name: Проверить SSH-доступ ко всем выбранным серверам
  hosts: all:!localhost
  gather_facts: false
  become: false
  vars:
    ansible_connection: ssh
    ansible_become: false
  tasks:
    - name: Проверить аутентификацию и выполнение команды через SSH
      ansible.builtin.raw: /bin/true
      changed_when: false
      check_mode: false
      tags: [fleet_ssh_probe]
